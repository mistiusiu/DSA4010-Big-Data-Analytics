services:
  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
    volumes:
      - namenode:/opt/hadoop/data/nameNode
      - ./hadoop_config:/opt/hadoop/etc/hadoop:z
      - ./start-hdfs.sh:/start-hdfs.sh:z
    ports:
      - "9870:9870"
      - "9000:9000"
    command: [ "/bin/bash", "/start-hdfs.sh" ]
    networks:
      hdfs_network:
        ipv4_address: 172.20.0.2

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    hostname: datanode
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_DATANODE_OPTS="-Xmx512m -Xms256m"
    ports:
      - "9864:9864"
    volumes:
      - datanode:/opt/hadoop/data/dataNode
      - ./hadoop_config:/opt/hadoop/etc/hadoop:z
      - ./init-datanode.sh:/init-datanode.sh:z
    depends_on:
      - namenode
    command: [ "/bin/bash", "/init-datanode.sh" ]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 512M    # Ensure the DataNode always has at least 512MB
    networks:
      hdfs_network:
        ipv4_address: 172.20.0.3

  # apps:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.apps
  #   container_name: hdfs_apps
  #   hostname: hdfs_apps
  #   volumes:
  #     - ./scripts:/src/scripts:z
  #     - ./data:/src/data:z
  #     - ./hadoop_config:/opt/hadoop/etc/hadoop:z
  #   networks:
  #     hdfs_network:
  #       ipv4_address: 172.20.0.10
  #   command: tail -f /dev/null
  #   depends_on:
  #     - namenode
  #     - datanode

  # Apache Hive
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hiv3p4ssw0rd
    volumes:
      - hive_db:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:z
    networks:
      hdfs_network:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  hive:
    image: ghcr.io/mistiusiu/bda_usiu/hive:4.0.0
    container_name: hive
    hostname: hive
    depends_on:
      namenode:
        condition: service_started
      datanode:
        condition: service_started
      hive-metastore-db:
        condition: service_healthy
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HIVE_SERVER2_THRIFT_PORT=10000
      - SERVICE_NAME=hiveserver2
      - DB_DRIVER=postgres
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hiv3p4ssw0rd
    ports:
      - "10000:10000"
      - "10002:10002"
      - "9083:9083"
    volumes:
      - ./hadoop_config:/opt/hadoop/etc/hadoop:z
    networks:
      hdfs_network:
        ipv4_address: 172.20.0.5

  hue:
    image: gethue/hue:latest
    container_name: hue
    hostname: hue
    ports:
      - "8888:8888"
    environment:
      - HIVE_SERVER_HOST=hive
      - HIVE_SERVER_PORT=10000
      - HDFS_CLUSTER_GLOBAL_NAME=hdfs://namenode:9000
      - WEBHDFS_URL=http://namenode:9870/webhdfs/v1
    volumes:
      - ./hue.ini:/usr/share/hue/desktop/conf/z-hue.ini:ro,z
    depends_on:
      - hive
    networks:
      hdfs_network:
        ipv4_address: 172.20.0.6

  # Apache Pig
  pig:
    image: ghcr.io/mistiusiu/bda_usiu/pig:2026.7.28.6
    container_name: pig

    depends_on:
      - namenode
      - datanode

    volumes:
      - ./hadoop_config:/opt/hadoop/etc/hadoop:ro,z
      - ./workspace:/workspace:z

    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      PIG_HOME: /opt/pig

    stdin_open: true
    tty: true

    networks:
      hdfs_network:
        ipv4_address: 172.20.0.7

  # Apache Spark
  spark:
    image: apache/spark:4.2.0-scala2.13-java25-python3-r-ubuntu
    container_name: spark
    hostname: spark

    depends_on:
      - namenode
      - datanode

    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      SPARK_MODE: client
      SPARK_HOME: /opt/spark
      PATH: /opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      - ./hadoop_config:/opt/hadoop/etc/hadoop:ro,z
      - ./workspace:/workspace:z

    working_dir: /workspace

    stdin_open: true
    tty: true

    command: ["/bin/bash"]

    ports:
      - "4040:4040"   # Spark application UI (when running locally)
      - "8080:8080"   # Optional if running a standalone master later

    networks:
      hdfs_network:
        ipv4_address: 172.20.0.8


volumes:
  namenode:
  datanode:
  hive_db:


networks:
  hdfs_network:
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
